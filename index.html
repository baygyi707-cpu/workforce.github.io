<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Control System</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --dark: #172033;
      --text: #334155;

      --background: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;

      margin: 0;
      padding: 0;
    }

    }

      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
    }

    .brand {
      display: flex;

      font-weight: bold;
      margin-bottom: 45px;
      padding: 0 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--primary);
      font-size: 21px;
    }

    .nav-item {
      display: flex;
      align-items: center;

      align-items: center;
      gap: 15px;
      margin-bottom: 28px;
    }

    }

    .topbar p {
      color: var(--muted);
      font-size: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 14px;

      padding: 11px 16px;
      transition: 0.2s;
    }

    .btn-primary {
      color: white;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      color: var(--text);
      background: #e2e8f0;
    }

    .btn-danger {
      color: white;
      background: var(--danger);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card);
      padding: 21px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .stat-card .label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stat-card .value {
      color: var(--dark);
      font-size: 27px;
      font-weight: bold;
    }

    .stat-card .icon {
      float: right;
      font-size: 25px;
      background: #eff6ff;
      padding: 8px;
      border-radius: 9px;
    }

    .content-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .card-header h2 {
      color: var(--dark);
      font-size: 19px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 18px 20px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .search-box,
    select {
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      background: white;
      color: var(--text);
    }

    .search-box {
      min-width: 250px;
      flex: 1;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {

    }

      color: #166534;

    }

    .badge.low-stock {

    }

    .badge.out-stock {

    }

    .actions {
      display: flex;

    }

    .action-btn {
      padding: 7px 10px;
      color: white;
      font-size: 12px;
    }

    .edit-btn {
      background: var(--primary);
    }

    .delete-btn {
      background: var(--danger);
    }

    .empty {
      text-align: center;

    }

      padding: 20px;
    }
